    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
    ctx.fill();
  }

  // ---- カード全体を描く。dry=true のときは、高さを測るだけ ----
  function render(ctx, dry, totalH) {
    var y = 0;
    function text(measure, x, yy, w, fs, t, o) {
      o = o || {};
      var ls = layout(ctx, t, fs, w, o.bold);
      if (!measure && !dry) drawLines(ctx, ls, x, yy, fs, o.align || 'left', w, o.color || INK, o.bold);
      return ls.length * fs * 2.0;
    }
    function section(color, fn) {
      var h = fn(true, 0);
      if (!dry) { roundRect(ctx, PAD, y, INNER, h + SP * 2, 28, color); fn(false, y + SP); }
      y += h + SP * 2 + GAP;
    }
    var X = PAD + SP, IW = INNER - SP * 2;

    if (!dry) { ctx.fillStyle = 'hsl(' + hue + ',85%,90%)'; ctx.fillRect(0, 0, W * 2, totalH); }

    // ---- 左の列: 動物・5つの軸・つよみ・気をつけること ----
    ctx.save();
    y = 40;
    y += text(false, PAD, y, INNER, 34, 'あなたは', { align: 'center' });
    if (!dry) {
      ctx.fillStyle = '#fff'; ctx.strokeStyle = MID; ctx.lineWidth = 12;
      ctx.beginPath(); ctx.arc(W / 2, y + 160, 150, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
      ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
      ctx.font = '190px ' + EMOJI; ctx.fillText(type.emoji, W / 2, y + 170);
    }
    y += 340;
    if (!dry) {
      ctx.fillStyle = DEEP; ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.font = font(96, true); ctx.fillText(type.name, W / 2, y + 80);
      ctx.fillStyle = INK; ctx.globalAlpha = .6; ctx.font = font(28); ctx.fillText(type.code, W / 2, y + 125);
      ctx.globalAlpha = 1;
    }
    y += 150;
    y += text(false, PAD + 20, y, INNER - 40, 38, type.summary, { align: 'center' });
    if (R.balanced) {
      y += text(false, PAD + 20, y, INNER - 40, 30, '5つの軸(じく)が、ぜんぶ真(ま)ん中(なか)あたり。バランスがたです。', { align: 'center' });
    }
    if (R.sub >= 0) {
      var st = D.types[R.sub];
      y += text(false, PAD + 10, y, INNER - 20, 27, '「' + type.name + '」にちかいけれど、「' + st.emoji + st.name + '」のようそもあるよ。', { align: 'center' });
    }
    y += GAP;

    // 5つの軸
    section('#fff', function (measure, top) {
      var yy = top;
      yy += text(measure, X, yy, IW, 40, '5つの軸(じく)', { bold: true });
      D.axes.forEach(function (ax, a) {
        var hi = Math.round((scores[a] - 4) * 100 / 16), lo = 100 - hi;
        yy += 8;
        yy += text(measure, X, yy, IW, 30, ax.label, { bold: true });
        text(measure, X, yy, IW / 2, 28, D.poles[a][0] + ' ' + lo + '%');
        yy += text(measure, X + IW / 2, yy, IW / 2, 28, D.poles[a][1] + ' ' + hi + '%', { align: 'right' });
        if (!measure && !dry) {
          roundRect(ctx, X, yy, IW, 22, 11, '#8cc3c3');
          if (hi > 0) {
            ctx.save(); ctx.beginPath(); ctx.rect(X + IW * lo / 100, yy, IW, 22); ctx.clip();
            roundRect(ctx, X, yy, IW, 22, 11, '#177a7a'); ctx.restore();
          }
        }
        yy += 22 + 14;
      });
      return yy - top;
    });

    // つよみ
    section('#dff3e6', function (measure, top) {
      var yy = top;
      yy += text(measure, X, yy, IW, 38, 'あなたのつよみ', { bold: true });
      R.strengths.forEach(function (s) { yy += text(measure, X, yy, IW, 32, '・' + s); });
      return yy - top;
    });

    // 気をつけること
    section('#fff1cf', function (measure, top) {
      var yy = top;
      yy += text(measure, X, yy, IW, 36, 'ちょっと気(き)をつけると、もっと楽(らく)になること', { bold: true });
      R.weaknesses.forEach(function (s) { yy += text(measure, X, yy, IW, 32, '・' + s); });
      return yy - top;
    });

    var leftEnd = y;
    ctx.restore();

    // ---- 右の列: 学校・ふだんのくらし・相性 ----
    ctx.save();
    ctx.translate(W, 0);
    y = 40;
    function facts(title, items) {
      section('#fff', function (measure, top) {
        var yy = top;
        yy += text(measure, X, yy, IW, 38, title, { bold: true });
        items.forEach(function (it) {
          yy += 6;
          yy += text(measure, X, yy, IW, 28, it[0], { bold: true, color: DEEP });
          yy += text(measure, X, yy, IW, 32, it[1]);
        });
        return yy - top;
      });
    }
    facts('学校(がっこう)でのすがた', [
      ['ふだんの様子(ようす)', type.school],
      ['むいている係(かかり)・部活(ぶかつ)', type.fit],
      ['ラッキーアイテム', type.lucky]]);
    facts('ふだんのくらしでのすがた', [
      ['休日(きゅうじつ)の過(す)ごし方(かた)', type.holiday],
      ['向(む)いているお仕事(しごと)', type.job],
      ['口(くち)ぐせ', type.phrase],
      ['元気(げんき)が出(で)る方法(ほうほう)', type.recharge]]);

    // 相性
    section('#fff', function (measure, top) {
      var yy = top;
      yy += text(measure, X, yy, IW, 38, '相性(あいしょう)', { bold: true });
      D.compat.forEach(function (c) {
        var o = R.main ^ c.flip, ot = D.types[o], oh = (o * 137) % 360;
        yy += 10;
        var textX = X + 110, textW = IW - 110 - 16;
        var reasonH = text(true, textX, 0, textW, 28, c.reason);
        var rowH = Math.max(120, 16 + 58 + reasonH + 12);
        if (!measure && !dry) {
          roundRect(ctx, X, yy, IW, rowH, 22, 'hsl(' + oh + ',85%,94%)');
          ctx.fillStyle = '#fff'; ctx.strokeStyle = 'hsl(' + oh + ',55%,45%)'; ctx.lineWidth = 5;
          ctx.beginPath(); ctx.arc(X + 56, yy + rowH / 2, 40, 0, Math.PI * 2); ctx.fill(); ctx.stroke();
          ctx.fillStyle = '#000'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
          ctx.font = '44px ' + EMOJI; ctx.fillText(ot.emoji, X + 56, yy + rowH / 2 + 4);
          ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic'; ctx.fillStyle = INK;
          ctx.font = font(34, true); ctx.fillText(ot.name, textX, yy + 16 + 40);
          var nw = ctx.measureText(ot.name).width;
          var lab = layout(ctx, c.label, 26, textW - nw - 14, true);
          drawLines(ctx, lab, textX + nw + 14, yy + 16 + 40 - 26 * 1.5, 26, 'left', textW - nw - 14, INK, true);
          text(false, textX, yy + 16 + 58, textW, 28, c.reason);
        }
        yy += rowH;
      });
      return yy - top;
    });

    var rightEnd = y;
    ctx.restore();

    // 注意書き(下に、左右をまたいで)
    y = Math.max(leftEnd, rightEnd);
    var FW = W * 2 - PAD * 2;
    y += text(false, PAD, y, FW, 30, 'どうぶつ性格(せいかく)チェック', { align: 'center', color: 'rgba(29,54,56,.7)' });
    y += text(false, PAD + 20, y, FW - 40, 26,
      'この診断(しんだん)はAI(Claude)が作(つく)ったもので、確実(かくじつ)に正(ただ)しいとは言(い)えません。けっかは、そのときの気分(きぶん)でもかわります。',
      { align: 'center', color: 'rgba(29,54,56,.7)' });
    return y + 30;
  }

  var c = document.getElementById('card');
  var H = Math.ceil(render(document.createElement('canvas').getContext('2d'), true, 0));
  c.width = W * 2; c.height = H;
  render(c.getContext('2d'), false, H);

  c.toBlob(function (blob) {
    var url = URL.createObjectURL(blob);
    var img = document.getElementById('card-img'), a = document.getElementById('save');
    img.src = url; img.hidden = false;
    a.href = url; a.hidden = false;
    document.getElementById('tip').hidden = false;
    msg.hidden = true;
  }, 'image/png');
})();
</script>
</body>
